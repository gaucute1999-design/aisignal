<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AI Signal Bot</title>

<style>

body{
background:#0a0a0a;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
color:white;
}

.card{
width:350px;
padding:25px;
border-radius:20px;
border:2px solid #00e5ff;
box-shadow:0 0 20px #00e5ff;
text-align:center;
}

.title{
font-size:28px;
font-weight:bold;
color:#00e5ff;
margin-bottom:15px;
}

.timer{
font-size:60px;
margin:15px 0;
}

.signal{
font-size:42px;
font-weight:bold;
margin-top:15px;
}

.conf{
font-size:24px;
margin-top:10px;
}

.status{
font-size:18px;
color:#ccc;
margin-top:10px;
}

</style>
</head>

<body>

<div class="card">

<div class="title">
AI SIGNAL BOT
</div>

<div>BTC/USDT</div>

<div class="timer" id="timer">
60
</div>

<div class="signal" id="signal">
...
</div>

<div class="conf" id="confidence">
Waiting...
</div>

<div class="status" id="status">
Analyzing market...
</div>

</div>

<script>

let time = 60;
let signalShown = false;

function newRound(){

time = 60;
signalShown = false;

document.getElementById("signal").innerHTML = "...";
document.getElementById("confidence").innerHTML = "Waiting...";
document.getElementById("status").innerHTML = "Analyzing market...";

}

function tick(){

time--;

document.getElementById("timer").innerHTML = time;

if(time <= 20 && signalShown === false){

signalShown = true;

let confidence =
Math.floor(Math.random()*36)+65;

let buySell =
Math.random() > 0.5 ? "BUY ↑" : "SELL ↓";

let color =
buySell.includes("BUY") ? "#00ff66" : "#ff4444";

document.getElementById("signal").innerHTML =
'<span style="color:'+color+'">'+buySell+'</span>';

document.getElementById("confidence").innerHTML =
confidence + "% Confidence";

document.getElementById("status").innerHTML =
"Signal Found";

}

if(time <= 0){

newRound();

}

}

setInterval(tick,1000);

</script>

</body>
</html>
